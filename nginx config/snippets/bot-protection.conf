# ==============================================================================
# SNIPPET: bot-protection.conf
# Description: Centralized edge bot mitigation, scraper blocking, and probe trap
# ==============================================================================

# 1. BLOCK EMPTY & MISSING USER AGENTS
if ($http_user_agent ~* "^(-)?$") {
    return 403;
}

# 2. BLOCK KNOWN BAD BOTS, SCRAPERS & SPOOFED USER AGENTS
if ($http_user_agent ~* (zgrab|metabase-cve|Bytespider|ClaudeBot|DotBot|SemrushBot|LinkChecker|AffsignalCrawler|QIHU|Firefox\/3\.5)) {
    return 403;
}

# 3. REJECT MATCHED BAD BOTS FROM ORCHESTRATOR MAP (Palo Alto, Sogou, Ahrefs, etc.)
if ($bad_bot) {
    return 403;
}

# 4. DOUBLE-SLASH EVASION & WORDPRESS PATH PROBES
# Catches probes like //blog/wp-includes/wlwmanifest.xml, //wordpress/..., //cms/...
location ~* ^//?+(?:wp-includes|wp-admin|wp-content|wordpress|cms|wlwmanifest\.xml|xmlrpc\.php) {
    access_log /var/log/nginx/bot_traps.log custom_log;
    return 403;
}

# 5. HONEYPOT & CRITICAL EXPLOIT FILE EXTENSION BLOCKER
# Catches direct PHP execution attempts (.php) and sensitive config exposures
# /\. catches requests for .env files, including .env.prod etc, and any dot files
location ~* (/\.|\.(?:bak|config|sql|php|yml|yaml|conf|log|ini|ppk|rsa)$|docker|passwd|\.git/|etc/|wlwmanifest\.xml|xmlrpc\.php) {
    access_log /var/log/nginx/bot_traps.log custom_log;
    return 403;
}

# 6. BLOCK MALICIOUS BACKDOOR PATH PATTERNS
location ~* ^/(actuator|debug|doh|dns-query|admin|phpmyadmin|setup|setup-config|cgi-bin|autodiscover) {
    location ~* \.(webmanifest|ico|png|jpg|css|js|xml)$ {
        # Allow static files inside matched paths if they physically exist
        try_files $uri =404;
    }
    access_log /var/log/nginx/bot_traps.log custom_log;
    return 403;
}
