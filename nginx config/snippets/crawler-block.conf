# /etc/nginx/nginx-config/snippets/crawler-block.conf
# Complete crawler & search engine isolation for non-public hosts (beta, admin, etc.)

# 1. Instruct compliant indexers to drop pages entirely
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

# 2. Block all bots, crawlers, scrapers, and spiders immediately
if ($http_user_agent ~* (bot|crawler|spider|scraper|slurp|meta-externalagent|facebookexternalhit|bytespider|claudebot|gptbot|semrushbot|ahrefsbot|petalbot|bingbot|googlebot)) {
    return 403;
}

# 3. Serve an inline virtual robots.txt
location = /robots.txt {
    add_header Content-Type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}
