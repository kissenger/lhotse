# /etc/nginx/nginx-config/snippets/access-control.conf

# Allow access if EITHER IP matches OR valid Basic Auth is provided
satisfy any;

# 1. Trusted Local Network (No password prompt)
allow 192.168.1.0/24;

# 2. Add your home/remote public IP here if applicable (No password prompt)
allow 212.159.122.171;

# 3. Basic Auth fallback for external traffic/scanners
auth_basic "Restricted Area";
auth_basic_user_file /etc/nginx/.htpasswd;

# Deny all others who fail Basic Auth
deny all;
