# /etc/nginx/sites-available/10-www-redirects.conf

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.snorkelology.co.uk www.beta.snorkelology.co.uk;

    ssl_certificate /etc/letsencrypt/live/snorkelology.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/snorkelology.co.uk/privkey.pem; # managed by Certbot

    include /etc/nginx/nginx-config/snippets/bot-protection.conf;

    # Dynamically strips 'www.' for any matching domain
    if ($host ~* ^www\.(.+)$) {
        set $raw_domain $1;
        return 301 https://$raw_domain$request_uri;
    }

    return 301 https://snorkelology.co.uk$request_uri;
}
