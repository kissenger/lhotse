server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.snorkelology.co.uk;
    root /home/gort1975/snorkelology/master/dist/browser;

    ssl_certificate /etc/letsencrypt/live/snorkelology.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snorkelology.co.uk/privkey.pem;

    # Shared security & crawler isolation
    include /etc/nginx/nginx-config/snippets/bot-protection.conf;
    include /etc/nginx/nginx-config/snippets/crawler-block.conf;
    include /etc/nginx/nginx-config/snippets/access-control.conf;

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|webp|avif|webmanifest|json)$ {
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        add_header Cache-Control "private, no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Cache-Status BYPASS always;

        access_log off;
        proxy_pass http://snorkel_backend_admin;
        include snippets/proxy-headers.conf;
        include snippets/security-headers.conf;
    }

    location / {
        include snippets/security-headers.conf;

        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        add_header Cache-Control "private, no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Cache-Status BYPASS always;

        proxy_pass http://snorkel_backend_admin;
        include snippets/proxy-headers.conf;

        client_max_body_size 50M;
    }
}
