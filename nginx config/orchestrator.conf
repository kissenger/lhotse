###############################################################################
# NGINX ORCHESTRATOR CONFIGURATION
# Location: /etc/nginx/nginx-config/orchestrator.conf
#
# Usage:
#   Include this file directly inside the main `http { ... }` block of /etc/nginx/nginx.conf:
#
#   http {
#       include /etc/nginx/nginx-config/orchestrator.conf;
#   }
#
# IMPORTANT:
#   Do NOT include this file inside a `server { ... }` block, as it defines global
#   `upstream`, `map`, and `limit_req_zone` directives.
###############################################################################

# =============================================================================
# 1. UPSTREAM BACKEND DEFINITIONS
# Define local Node.js application services running on internal ports.
# Keepalive connections are enabled for performance optimization.
# =============================================================================

# Public Production Backend (Snorkelology)
upstream snorkel_backend_prod {
    server 192.168.1.136:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Staging/Beta Backend (Snorkelology Beta)
upstream snorkel_backend_beta {
    server 192.168.1.136:4001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Admin Backend (Snorkelology Admin)
upstream snorkel_backend_admin {
    server 192.168.1.136:4000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Application Backend (Practice Night)
upstream practicenight_backend {
    server 192.168.1.136:4005 max_fails=3 fail_timeout=10s;
    keepalive 16;
}


# =============================================================================
# 2. GLOBAL RATE LIMITING ZONES
# Protect backends from rapid-fire scrapers and brute-force traffic.
# =============================================================================

# Tracks client IP addresses in a 10MB shared memory zone (holds ~160,000 IPs).
# Limits requests to 5 requests per second per IP globally across all virtual hosts.
limit_req_zone $binary_remote_addr zone=global_bot_limit:10m rate=5r/s;


# =============================================================================
# 3. DYNAMIC MAP VARIABLES
# Evaluates request attributes to dynamically control caching and header behavior.
# =============================================================================

# Map: Session Cookie Bypass
# Evaluates whether a session cookie exists to bypass proxy cache for logged-in users.
# Note: $cookie_session tracks the HTTP cookie named "session".
map $cookie_session $snorkel_cache_bypass {
    default 0;  # Anonymous users: Use cache
    "~.+"   1;  # Logged-in users (session cookie present): Bypass cache
}

# Map: Dynamic Cache-Control Header Output
# Sets appropriate HTTP response Cache-Control headers based on user authentication state.
map $cookie_session $snorkel_dynamic_cache_control {
    default "public, max-age=0, must-revalidate";  # Public cached dynamic content
    "~.+"   "private, no-cache, no-store, must-revalidate"; # Private user session
}

# Map: Static Asset Cache-Control Header
# Long-term immutability header for versioned/static files.
map $uri $snorkel_static_cache_control {
    default "public, max-age=31536000, immutable";
}

# Map: Debugging X-Cache-Status Header
# Exposes cache HIT/MISS status for inspection via curl or dev tools.
map $upstream_cache_status $snorkel_cache_status_header {
    default $upstream_cache_status;
    ""      "BYPASS";
}

# Map bad user-agents to a block variable
map $http_user_agent $bad_bot {
    default 0;
    
    # Vulnerability Scanners & Recon Tools
    "~*Palo Alto Networks" 1;
    "~*Cortex-Xpanse" 1;
    "~*python-requests" 1;
    
    # Aggressive / Non-Essential SEO Crawlers
    "~*SERankingBacklinksBot" 1;
    "~*Sogou" 1;
    "~*AhrefsBot" 1;
    "~*SemrushBot" 1;
}

# =============================================================================
# 4. EXPLICIT SEQUENCED FILE INCLUDES
# Loads redirect rules, public server blocks, and admin/app configurations in order.
# =============================================================================

# HTTP to HTTPS Global Redirect Rule
include /etc/nginx/nginx-config/00-http-to-https.conf;

# Domain Canonicalization & www Redirects
include /etc/nginx/nginx-config/10-www-snorkelology-redirects.conf;
# include /etc/nginx/nginx-config/11-www-practicenight-redirect.conf;
# include /etc/nginx/nginx-config/12-www-beta-redirect.conf;

# Application Server Configurations
include /etc/nginx/nginx-config/20-snorkelology-public.conf; # Public Cached Production Site
include /etc/nginx/nginx-config/21-snorkelology-beta.conf;   # Isolated Uncached Beta Staging
include /etc/nginx/nginx-config/30-snorkelology-admin.conf;  # Admin Management Interface
include /etc/nginx/nginx-config/40-practicenight.conf;       # Practice Night App Service
