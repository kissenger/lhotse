@if (summary && !dismissed) {
  <aside
    class="sst-banner"
    [class.sst-banner--visible]="visible"
    aria-label="Latest coastal sea-temperature update">
    <div class="sst-banner__reveal">
      <div class="sst-banner__inner" #inner>
        <span class="sst-banner__logo-gap" aria-hidden="true"></span>
        <p class="sst-banner__message">
          
          Did you know that coastal sea temperatures are currently 
          <b>{{ deviation }}&deg;C</b> {{ comparison }} the long term average?
          <a routerLink="/articles/live-britain-and-ireland-coastal-sea-temperatures">Explore the latest data</a>
        </p>
        <button
          type="button"
          class="sst-banner__dismiss"
          aria-label="Dismiss sea-temperature update"
          title="Dismiss"
          (click)="dismiss()">&times;</button>
      </div>
    </div>
  </aside>
}
