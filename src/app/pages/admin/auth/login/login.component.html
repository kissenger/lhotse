
<div class="page-container">

  <form class="login-container">
    
    <div class="header">
      Login Form
    </div>

    <div class="inputs">
      <label for="username">Username</label>
      <input #usernameInput type="text" id="username" name="username" autocomplete="username" [(ngModel)]="user.username" (input)="onFieldInput()" (change)="onFieldInput()">
      <label for="password">Password</label>
      <input #passwordInput type="password" id="password" name="password" autocomplete="current-password" [(ngModel)]="user.password" (input)="onFieldInput()" (change)="onFieldInput()">
    </div>

    <div class="buttons">
      <button class="login-submit" [disabled]="!isValidForm()" (click)="onSubmit()">Submit</button>
      <button type="button" class="login-cancel" (click)="onCancel()">Cancel</button>
    </div>

  </form>

</div>
